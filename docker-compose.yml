services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    image: digitalsecurity-app
    container_name: digitalsecurity-app
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - digitalsecurity

  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx
    image: digitalsecurity-nginx
    container_name: digitalsecurity-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - app_storage:/var/www/html/storage:ro
    depends_on:
      - app
    networks:
      - digitalsecurity

  db:
    image: mysql:8.4
    container_name: digitalsecurity-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-digitalsecurity}
      MYSQL_USER: ${DB_USERNAME:-digitalsecurity}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD harus diisi di file .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD harus diisi di file .env}
    command:
      - --innodb-buffer-pool-size=256M
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - digitalsecurity

  scheduler:
    image: digitalsecurity-app
    container_name: digitalsecurity-scheduler
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_started
    networks:
      - digitalsecurity

networks:
  digitalsecurity:
    driver: bridge

volumes:
  db_data:
  app_storage: