# DSMS Docker Compose (review/test template)
# NOT a verified production deployment. Review, test locally, and adapt secrets/TLS/backup before production use.

name: dsms

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: dsms-app:local
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./:/var/www/html
      - dsms_storage:/var/www/html/storage
      - dsms_cache:/var/www/html/bootstrap/cache
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dsms

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html:ro
      - dsms_storage:/var/www/html/storage:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - dsms

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-dsms}
      MYSQL_USER: ${DB_USERNAME:-dsms}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change_me}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change_me_root}
    volumes:
      - dsms_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - dsms

  scheduler:
    image: dsms-app:local
    restart: unless-stopped
    env_file:
      - .env
    command: sh -lc "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    volumes:
      - ./:/var/www/html
      - dsms_storage:/var/www/html/storage
      - dsms_cache:/var/www/html/bootstrap/cache
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dsms

  # Optional: enable only if queued jobs are introduced.
  # queue:
  #   image: dsms-app:local
  #   restart: unless-stopped
  #   env_file:
  #     - .env
  #   command: php artisan queue:work --verbose --tries=3 --timeout=90
  #   volumes:
  #     - ./:/var/www/html
  #     - dsms_storage:/var/www/html/storage
  #     - dsms_cache:/var/www/html/bootstrap/cache
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   networks:
  #     - dsms

volumes:
  dsms_mysql:
  dsms_storage:
  dsms_cache:

networks:
  dsms:
    driver: bridge
